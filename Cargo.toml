[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["JC Studio Contributors"]
repository = "https://github.com/jhotis/jc-studio"

[workspace.dependencies]
# ---- internal ----
jcs-core = { path = "crates/jcs-core", version = "0.1.0" }
jcs-proto = { path = "crates/jcs-proto", version = "0.1.0" }
jcs-store = { path = "crates/jcs-store", version = "0.1.0" }
jcs-agent = { path = "crates/jcs-agent", version = "0.1.0" }
jcs-gates = { path = "crates/jcs-gates", version = "0.1.0" }
jcs-policy = { path = "crates/jcs-policy", version = "0.1.0" }
jcs-git = { path = "crates/jcs-git", version = "0.1.0" }

# ---- async runtime ----
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
bytes = "1"

# ---- http (loopback, opencode) ----
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# ---- http (unix socket, daemon <-> cli) ----
axum = "0.8"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# ---- data ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    # Bundled SQLite. sqlx 0.9 pins libsqlite3-sys 0.30.1, whose embedded SQLite is
    # affected by RUSTSEC-2026-0459; see deny.toml for the accepted-risk rationale.
    # The unbundled path (system SQLite 3.54.0) needs libclang to generate bindings.
    "sqlite",
    "migrate",
    "macros",
] }

# ---- misc ----
anyhow = "1"
thiserror = "2"
jiff = { version = "1", features = ["serde"] }
toml = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dirs = "5"

# ---- dev ----
proptest = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
# Keep debug info but speed up the inner loop for a large workspace.
debug = 1
