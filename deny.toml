# cargo-deny configuration.
#
# Checked in CI and by `just audit`. The point is to catch a vulnerable or
# license-incompatible dependency before it ships, not to be exhaustive.

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"

# Accepted risk, with a concrete exit condition.
ignore = [
    { id = "RUSTSEC-2026-0459", reason = "sqlx 0.9 pins libsqlite3-sys 0.30.1, whose bundled SQLite is < 3.54.0. Exploiting it requires the victim to open a crafted database together with a sibling WAL file whose page size differs; jcsd opens only the database it created itself, inside the user's private data directory, and rejects any database it did not initialize. Revisit when sqlx allows libsqlite3-sys >= 0.39, or when the build environment provides libclang so the system SQLite (3.54.0 here) can be linked with `sqlite-unbundled`." },
]

[licenses]
# Permissive licenses only. Anything copyleft needs a deliberate decision.
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Dependencies that must never appear: unsafe crypto and unmaintained TLS stacks.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
